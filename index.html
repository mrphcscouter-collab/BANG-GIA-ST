#info{font-size:14px;color:var(--mute);margin:10px 2px 6px}

.top{display:flex;align-items:center;gap:12px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.nm small,.sub{color:var(--mute);font-size:13px}
.tag{flex:none;background:var(--tag);color:var(--tagink);font-weight:800;font-size:24px;padding:6px 12px 6px 16px;border-radius:6px 10px 10px 6px;position:relative;white-space:nowrap}

.tag i{font-style:normal;font-size:15px;font-weight:600;margin-left:1px}
.sub{margin-top:6px}
.calc{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:center;gap:8px;flex-wrap:wrap}
.card.open .calc{display:flex}
.calc button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;cursor:pointer}
.calc input{width:76px;height:44px;text-align:center;font:inherit;font-size:18px;font-weight:600;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tot{margin-left:auto;font-weight:800;font-size:20px}
.more,.empty{display:block;width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:center}
.empty{border:0;color:var(--mute);font-weight:400;padding:28px 10px}
button:focus-visible,.ch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

function run(){
  const toks=norm(st.q).split(" ").filter(Boolean),q=toks.join(" ");

function card(it){
  const q=st.qty[it.i]||1,o=st.open===it.i;

}

function upd(c,i,q){st.qty[i]=q;c.querySelector("input").value=q;c.querySelector(".tot").textContent=fm(q*items[i].p)+"đ"}
$("out").onclick=e=>{

  const c=e.target.closest(".card");if(!c)return;const i=+c.dataset.i;

};
