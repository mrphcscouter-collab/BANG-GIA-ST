<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a86">
<title>Tra cứu giá - Nhựa Siêu Thanh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f2;--card:#fff;--ink:#17232d;--mute:#5d6b76;--line:#d5dce0;--blue:#0b5a86;--blueink:#fff;--tag:#ffd53d;--tagink:#241a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--card:#1a252d;--ink:#eaf0f3;--mute:#98a7b1;--line:#2c3a44;--blue:#58b4e6;--blueink:#06202f}}
:root[data-theme="dark"]{--bg:#10181e;--card:#1a252d;--ink:#eaf0f3;--mute:#98a7b1;--line:#2c3a44;--blue:#58b4e6;--blueink:#06202f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.35}
button,input{touch-action:manipulation}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
h1{font-size:15px;margin:0;font-weight:600;color:var(--mute)}
.tip{display:none;font-size:13px;color:var(--mute)}
.sb{position:relative}
#q{width:100%;font:inherit;font-size:20px;font-weight:600;padding:14px 48px 14px 14px;border:2px solid var(--blue);border-radius:12px;background:var(--card);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
#q:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 30%,transparent)}
#x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:22px;display:none;cursor:pointer}
.row{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row[hidden]{display:none}
.ch{flex:none;font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px}
.ch:hover{border-color:var(--blue)}
.ch.on{background:var(--blue);border-color:var(--blue);color:var(--blueink)}
.ch.sz{border-radius:10px;min-width:52px;padding:9px 12px}
#info{font-size:14px;color:var(--mute);margin:10px 2px 6px;min-height:20px}
#out{display:grid;grid-template-columns:1fr;gap:8px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--blue)}
.top{display:flex;align-items:center;gap:12px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.nm small,.sub{color:var(--mute);font-size:13px}
.tag{flex:none;background:var(--tag);color:var(--tagink);font-weight:800;font-size:24px;padding:6px 12px 6px 16px;border-radius:6px 10px 10px 6px;position:relative;white-space:nowrap}
.tag.lg{font-size:20px}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--card)}
.tag i{font-style:normal;font-size:15px;font-weight:600;margin-left:1px}
.sub{margin-top:6px}
.calc{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);align-items:center;gap:8px;flex-wrap:wrap}
.card.open .calc{display:flex}
.calc button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;cursor:pointer}
.calc input{width:76px;height:44px;text-align:center;font:inherit;font-size:18px;font-weight:600;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tot{margin-left:auto;font-weight:800;font-size:20px}
.more,.empty{grid-column:1/-1;display:block;width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:center;cursor:pointer}
.empty{border:0;color:var(--mute);font-weight:400;padding:28px 10px;cursor:default}
button:focus-visible,.ch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (min-width:720px){
 .wrap{padding:0 28px 60px} header{padding:18px 0 10px} h1{font-size:17px} .tip{display:block}
 .row{flex-wrap:wrap;overflow:visible} #q{font-size:22px;padding:16px 52px 16px 18px}
 #out{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media (min-width:1100px){#out{grid-template-columns:repeat(3,1fr)}}

const st={cat:null,grp:null,size:null,q:"",lim:60,open:null,qty:{}};
const $=id=>document.getElementById(id);
const tm=(t,ws)=>/^\d+$/.test(t)?ws.includes(t):ws.some(w=>w.startsWith(t));
const names=[...CATS.map(c=>c[0]),"Khác"];
$("cats").innerHTML=names.map((n,i)=>gc.includes(i)?`<button class="ch" data-c="${i}">${n}</button>`:"").join("");
$("brands").innerHTML=G.map((g,i)=>gc[i]===PIPE?`<button class="ch" data-g="${i}">${esc(g.replace(/^Ống Nhựa\s*/i,""))}</button>`:"").join("");
const cnt={};items.forEach(it=>it.nw.forEach(w=>{if(/^\d+$/.test(w)&&+w>=14)cnt[w]=(cnt[w]||0)+1}));
const sizes=Object.keys(cnt).filter(k=>cnt[k]>=8).sort((a,b)=>a-b);
$("sizes").innerHTML=sizes.map(s=>`<button class="ch sz" data-s="${s}">${s}</button>`).join("");
function run(){
  const toks=norm(st.q).split(" ").filter(Boolean),q=toks.join(" ");
  document.querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",+b.dataset.c===st.cat));
  document.querySelectorAll("[data-g]").forEach(b=>b.classList.toggle("on",+b.dataset.g===st.grp));
  document.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===st.size));
  $("brands").hidden=st.cat!==PIPE;
  $("x").style.display=(st.q||st.cat!==null||st.size)?"block":"none";
  const out=$("out"),info=$("info");
  if(!toks.length&&st.cat===null&&!st.size){info.textContent=items.length+" mặt hàng";out.innerHTML='<div class="empty">Gõ tên hàng, hoặc chạm loại hàng và cỡ ở trên.<br>Ví dụ: chạm <b>Co</b> rồi <b>34</b>.</div>';return}
  const res=[];
  for(const it of items){
    if(st.cat!==null&&it.c!==st.cat)continue;
    if(st.grp!==null&&it.g!==st.grp)continue;
    if(st.size&&!it.nw.includes(st.size))continue;
    let rk=0;
    if(toks.length){if(it.nn===q)rk=0;else if(toks.every(t=>tm(t,it.nw)))rk=1;else if(toks.every(t=>tm(t,it.hw)))rk=2;else continue}
    res.push([rk,it.nw.length,it.i,it]);
  }
  res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
  info.textContent=res.length?res.length+" mặt hàng":"";
  if(!res.length){out.innerHTML='<div class="empty">Không thấy mặt hàng nào.<br>Thử gõ ngắn hơn, ví dụ “co 34”.</div>';return}
  out.innerHTML=res.slice(0,st.lim).map(r=>card(r[3])).join("")+(res.length>st.lim?'<button class="more" id="more">Xem thêm '+(res.length-st.lim)+' mặt hàng</button>':"");
}
function card(it){
  const q=st.qty[it.i]||1,o=st.open===it.i;
  const sub=it.v?"Giá VAT "+fm(it.v)+"đ"+(it.b?" · "+esc(it.b):""):"Giá bán theo "+esc(it.u.toLowerCase());
  return `<div class="card${o?" open":""}" data-i="${it.i}"><div class="top"><div class="nm"><b>${esc(it.n.replace(/(\d)\s+[xX]\s+(\d)/g,"$1\u00a0x\u00a0$2"))}</b><small>${esc(G[it.g])}</small></div><div class="tag${it.p>=1e6?" lg":""}">${fm(it.p)}<i>đ</i></div></div>
<div class="sub">${sub}</div>
<div class="calc"><button data-m="-1" aria-label="Giảm">−</button><input type="number" inputmode="numeric" min="1" value="${q}" data-q="${it.i}" aria-label="Số lượng"><button data-m="1" aria-label="Tăng">+</button><span class="tot">${fm(q*it.p)}đ</span></div></div>`;
}
const reset=()=>{st.q="";st.cat=null;st.grp=null;st.size=null;st.lim=60;st.open=null;$("q").value="";run()};
$("q").addEventListener("input",e=>{st.q=e.target.value;st.lim=60;run()});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape"){reset()}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus();$("q").select()}});
$("x").onclick=()=>{reset();$("q").focus()};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;st.cat=st.cat===+b.dataset.c?null:+b.dataset.c;st.grp=null;st.lim=60;run()};
$("brands").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;st.grp=st.grp===+b.dataset.g?null:+b.dataset.g;st.lim=60;run()};
$("sizes").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;st.size=st.size===b.dataset.s?null:b.dataset.s;st.lim=60;run()};
$("out").onclick=e=>{
  if(e.target.id==="more"){st.lim+=100;run();return}
  const c=e.target.closest(".card");if(!c)return;const i=+c.dataset.i;
  const m=e.target.closest("[data-m]");
  if(m){const q=Math.max(1,(st.qty[i]||1)+ +m.dataset.m);st.qty[i]=q;c.querySelector("input").value=q;c.querySelector(".tot").textContent=fm(q*items[i].p)+"đ";return}
  if(e.target.closest(".calc"))return;
  st.open=st.open===i?null:i;document.querySelectorAll(".card.open").forEach(x=>x.classList.remove("open"));if(st.open!==null)c.classList.add("open");
};
$("out").addEventListener("input",e=>{const t=e.target.closest("[data-q]");if(!t)return;const i=+t.dataset.q,q=Math.max(1,parseInt(t.value)||1);st.qty[i]=q;t.closest(".card").querySelector(".tot").textContent=fm(q*items[i].p)+"đ"});
run();
if(matchMedia("(pointer:fine)").matches)$("q").focus();
</script></body></html>
